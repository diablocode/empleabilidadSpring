spring.application.name=empleabilidadSpring
server.port=${SERVER_PORT:8080}
app.fuseki.base-url=${FUSEKI_BASE_URL:http://localhost:3030}
app.fuseki.dataset=${FUSEKI_DATASET:empleabilidad}
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
